# Host checks plus the two ARM builds the consuming Buildroot configs need.
# Deliberately Docker-free: the gnueabihf link uses Ubuntu's cross gcc and the
# musl link uses the LLVM linker rustup already ships, so `cross` is not a
# dependency. See .cargo/config.toml.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  host:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # `cargo test` skips doc tests when --all-targets is given.
      - run: cargo test --doc

  arm:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install the cross linker
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Check the musl build really is static
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          file target/${{ matrix.target }}/release/itsalive | tee /dev/stderr \
            | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: itsalive-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/itsalive
          if-no-files-found: error
