# Cross-linking without Docker: the gnueabihf target uses the Debian/Ubuntu
# `gcc-arm-linux-gnueabihf` package; the musl target uses the LLVM linker that
# ships with rustup plus the self-contained musl sysroot, so it needs nothing
# installed at all.
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]

# The DE25-Nano (Agilex 5, AArch64): the same pair. Debian/Ubuntu's
# `gcc-aarch64-linux-gnu` for glibc, rust-lld and the bundled musl otherwise.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]
